[package]
name = "bessforge"
version = "1.0.1"
description = "BESSForge — BESS 10% Design Tool (ECI-EPCS)"
edition = "2021"

[lib]
name = "bessforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
