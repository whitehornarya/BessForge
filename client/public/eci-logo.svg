    <!-- Utility pole -->
    <rect x="10" y="18" width="3.5" height="72"/>
    <rect x="4" y="28" width="15.5" height="2.2"/>
    <rect x="4" y="38" width="15.5" height="2.2"/>
    <rect x="6" y="48" width="11.5" height="2.2"/>
    <circle cx="6.5" cy="29.1" r="2.2"/>
    <circle cx="16.5" cy="29.1" r="2.2"/>
    <circle cx="6.5" cy="39.1" r="2.2"/>
    <circle cx="16.5" cy="39.1" r="2.2"/>
    <circle cx="8" cy="49.1" r="2"/>
