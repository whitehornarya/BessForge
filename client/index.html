<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BESSForge</title>
  <meta name="description" content="Battery Energy Storage System Layout Tool">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234338ca' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 7h12M6 17h12M6 12h12'/%3E%3Crect x='3' y='3' width='18' height='18' rx='2' ry='2'/%3E%3C/svg%3E" />
  <script src="./config.js"></script>
  <style>
    /* Pre-load styling to prevent layout shift */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background-color: #f9fafb;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f9fafb;
      z-index: 9999;
    }
    .loader-text {
      margin-top: 16px;
      font-family: sans-serif;
      font-size: 16px;
      color: #4338ca;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(67, 56, 202, 0.2);
      border-radius: 50%;
      border-top: 4px solid #4338ca;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loader">
      <div class="spinner"></div>
      <div class="loader-text">Loading BESSForge...</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
