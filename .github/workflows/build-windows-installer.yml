# Builds every customer delivery format from one checkout and assembles the
# recursively audited all-formats release ZIP.
name: Build Complete Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-complete-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install and verify 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip executable not found at $sevenZip"
          }
          & $sevenZip i | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw '7-Zip verification failed'
          }

      - name: Build and audit every release format
        run: npm run package:complete

      - name: Upload the complete release
        uses: actions/upload-artifact@v4
        with:
          name: BESSForge-Complete-Release
          path: |
            dist/release/BESSForge_Complete_Release_*.zip
            dist/release/BESSForge_Complete_Release_*.zip.sha256
            dist/installer/*.exe
            dist/portable/*.zip
            dist/static/*.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach the complete ZIP to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/BESSForge_Complete_Release_*.zip
            dist/release/BESSForge_Complete_Release_*.zip.sha256
